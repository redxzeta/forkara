name: Upstream Audit

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      base_branch:
        description: "Fork branch whose evaluation state should be audited"
        required: false
        default: "built-from-scratch"
      upstream_branch:
        description: "Upstream branch name"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  audit:
    name: Report unevaluated upstream commits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout evaluated fork state
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.base_branch || 'built-from-scratch' }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Audit upstream
        env:
          BASE_BRANCH: ${{ github.event.inputs.base_branch || 'built-from-scratch' }}
          UPSTREAM_BRANCH: ${{ github.event.inputs.upstream_branch || 'main' }}
        run: |
          bun run sync:upstream \
            --base "$BASE_BRANCH" \
            --upstream "$UPSTREAM_BRANCH"
